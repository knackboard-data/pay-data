<svg xmlns="http://www.w3.org/2000/svg" class="pt-chart-svg" viewBox="0 0 360 402" width="100%" role="img" aria-labelledby="ptc-engineering-title ptc-engineering-desc" preserveAspectRatio="xMinYMin meet" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" style="max-width:360px;height:auto;color:#263b32;background:#fffdf6"><title id="ptc-engineering-title">Engineering: listed pay ranges, as posted</title><desc id="ptc-engineering-desc">Range chart of listed hourly pay as posted, low to high, for Engineering, platforms in alphabetical order, with the number of listings counted. Sweep Oct 26, 2026: DataAnnotation $125 to $125 per hour from 3 listings; Handshake AI $75 to $125 per hour from 10 listings; Mercor $50 to $125 per hour from 6 listings; micro1 $40 to $150 per hour from 4 listings.</desc><text x="0" y="15" font-weight="700" font-size="13" fill="currentColor">Listed pay ranges, as posted ($/hr)</text><text x="0" y="32" font-size="12" fill="currentColor" opacity=".8">As of Oct 26, 2026</text><line x1="46" x2="350" y1="220.0" y2="220.0" stroke="currentColor" stroke-opacity=".18"/><text x="40" y="223.5" text-anchor="end" font-size="11" fill="currentColor" opacity=".8">$0</text><line x1="46" x2="350" y1="191.7" y2="191.7" stroke="currentColor" stroke-opacity=".18"/><text x="40" y="195.2" text-anchor="end" font-size="11" fill="currentColor" opacity=".8">$25</text><line x1="46" x2="350" y1="163.3" y2="163.3" stroke="currentColor" stroke-opacity=".18"/><text x="40" y="166.8" text-anchor="end" font-size="11" fill="currentColor" opacity=".8">$50</text><line x1="46" x2="350" y1="135.0" y2="135.0" stroke="currentColor" stroke-opacity=".18"/><text x="40" y="138.5" text-anchor="end" font-size="11" fill="currentColor" opacity=".8">$75</text><line x1="46" x2="350" y1="106.7" y2="106.7" stroke="currentColor" stroke-opacity=".18"/><text x="40" y="110.2" text-anchor="end" font-size="11" fill="currentColor" opacity=".8">$100</text><line x1="46" x2="350" y1="78.3" y2="78.3" stroke="currentColor" stroke-opacity=".18"/><text x="40" y="81.8" text-anchor="end" font-size="11" fill="currentColor" opacity=".8">$125</text><line x1="46" x2="350" y1="50.0" y2="50.0" stroke="currentColor" stroke-opacity=".18"/><text x="40" y="53.5" text-anchor="end" font-size="11" fill="currentColor" opacity=".8">$150</text><rect x="77.0" y="76.3" width="14.0" height="4.0" rx="3" fill="#3f6fb5"/><text x="84.0" y="71.3" text-anchor="middle" font-size="11" fill="currentColor">$125</text><rect x="77.0" y="309.8" width="14.0" height="16.2" fill="#3f6fb5" fill-opacity=".55"/><text x="84.0" y="305.8" text-anchor="middle" font-size="11" fill="currentColor">3</text><rect x="153.0" y="78.3" width="14.0" height="56.7" rx="3" fill="#c0602f"/><text x="160.0" y="73.3" text-anchor="middle" font-size="11" fill="currentColor">$75-125</text><rect x="153.0" y="272.0" width="14.0" height="54.0" fill="#c0602f" fill-opacity=".55"/><text x="160.0" y="268.0" text-anchor="middle" font-size="11" fill="currentColor">10</text><rect x="229.0" y="78.3" width="14.0" height="85.0" rx="3" fill="#2e8a5c"/><text x="236.0" y="73.3" text-anchor="middle" font-size="11" fill="currentColor">$50-125</text><rect x="229.0" y="293.6" width="14.0" height="32.4" fill="#2e8a5c" fill-opacity=".55"/><text x="236.0" y="289.6" text-anchor="middle" font-size="11" fill="currentColor">6</text><rect x="305.0" y="50.0" width="14.0" height="124.7" rx="3" fill="#8a4fb0"/><text x="312.0" y="45.0" text-anchor="middle" font-size="11" fill="currentColor">$40-150</text><rect x="305.0" y="304.4" width="14.0" height="21.6" fill="#8a4fb0" fill-opacity=".55"/><text x="312.0" y="300.4" text-anchor="middle" font-size="11" fill="currentColor">4</text><text x="198.0" y="340" text-anchor="middle" font-size="11" fill="currentColor">Oct 26, 2026</text><line x1="46" x2="350" y1="326" y2="326" stroke="currentColor" stroke-opacity=".4"/><text x="0" y="250" font-size="12" fill="currentColor" opacity=".8">Listing